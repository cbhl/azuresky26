{% extends "base.html" %}

{% block content %}
<article class="post">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.date %}
    <p class="post-date"><time datetime="{{ page.date | date(format='%Y-%m-%d') }}">{{ page.date | date(format="%B %e, %Y") }}</time></p>
    {% endif %}
  </header>
  {{ page.content | safe }}
</article>
{% endblock content %}
